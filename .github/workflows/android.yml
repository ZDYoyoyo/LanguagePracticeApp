# 每次 push 自動：跑單元測試 → 建置測試版 APK。
# 金鑰都放在 GitHub → Settings → Secrets and variables → Actions，不在 repo 裡：
#   DEBUG_KEYSTORE_BASE64  測試版簽章金鑰（base64 文字）
#   GOOGLE_WEB_CLIENT_ID   Google 登入用的 Web Client ID
#   RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD  上架用上傳金鑰
#   ADMOB_APP_ID / ADMOB_INTERSTITIAL_ID / ADMOB_REWARDED_ID  正式廣告 ID（沒設定時 release 會用測試廣告）
name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write   # 用來更新「最新測試版」Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Play 要求每次上傳的 versionCode 都比之前大：用這個 workflow 的執行次數自動遞增
      - name: Set version code
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"

      - name: Restore debug keystore from secret
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_STORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::沒有設定 DEBUG_KEYSTORE_BASE64，APK 會用臨時金鑰簽章，無法覆蓋安裝舊版"
          fi

      # 下載依賴偶爾會因網路暫時失敗，失敗時等 30 秒自動重試一次
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon || (sleep 30 && ./gradlew testDebugUnitTest --no-daemon)

      - name: Build debug APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew assembleDebug --no-daemon || (sleep 30 && ./gradlew assembleDebug --no-daemon)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishPractice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # main 更新時，把 APK 放到固定的 Release，手機可以直接下載：
      # https://github.com/<owner>/<repo>/releases/tag/debug-latest
      - name: Publish to "debug-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EnglishPractice-debug.apk
          gh release view debug-latest >/dev/null 2>&1 || \
            gh release create debug-latest --prerelease --title "最新測試版（自動建置）" \
              --notes "每次 main 更新時自動建置的測試版 APK。下載 EnglishPractice-debug.apk 後直接安裝。"
          gh release upload debug-latest EnglishPractice-debug.apk --clobber

      # ---- 上架用：main 更新時建置簽好名的 AAB（上傳到 Play Console 用）----
      - name: Restore release keystore from secret
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::沒有設定 RELEASE_KEYSTORE_BASE64，略過上架用 AAB"
          fi

      - name: Build release AAB + release test APK
        if: github.ref == 'refs/heads/main' && env.RELEASE_STORE_FILE != ''
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          if [ -z "$ADMOB_APP_ID" ]; then
            echo "::warning::沒有設定正式 AdMob ID，release 版會顯示測試廣告（封閉測試可以，正式上架前要設定）"
          fi
          ./gradlew bundleRelease assembleRelease --no-daemon || (sleep 30 && ./gradlew bundleRelease assembleRelease --no-daemon)

      - name: Upload release AAB artifact
        if: github.ref == 'refs/heads/main' && env.RELEASE_STORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: EnglishPractice-release-aab-v${{ env.VERSION_CODE }}
          path: app/build/outputs/bundle/release/app-release.aab

      # 上架前先在手機裝「release 模式」的 APK 測試（程式碼經過 R8 壓縮，和上架版行為一致）
      - name: Publish release test APK
        if: github.ref == 'refs/heads/main' && env.RELEASE_STORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk EnglishPractice-release-test.apk
          gh release upload debug-latest EnglishPractice-release-test.apk --clobber

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 題庫遠端位置（非機密，可以 commit）。結尾要有 /
# 之後換 Cloudflare Pages 只要改這一行，例如 https://your-project.pages.dev/
questionBankBaseUrl=https://raw.githubusercontent.com/ZDYoyoyo/LanguagePracticeApp/main/question-bank/

# 隱私政策網址（上架必填）。可用 GitHub 上的 docs/privacy-policy.md 或之後放在 Cloudflare Pages
privacyPolicyUrl=https://github.com/ZDYoyoyo/LanguagePracticeApp/blob/main/docs/privacy-policy.md

# 廣告兒童設定：目標族群包含 13 歲以下兒童時改成 true（見 docs/children-and-ads.md）
adsChildDirected=false
# 廣告內容分級上限：G（所有年齡）/ PG / T / MA
adsMaxContentRating=G
